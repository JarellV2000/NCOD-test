<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NO CAP OR DRINK 2.0</title><style>body{margin:0;background:radial-gradient(circle at top,#542073,#110b20 70%);color:white;font-family:system-ui;text-align:center;padding:20px}h1{font-size:clamp(30px,7vw,60px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:850px;margin:24px auto}button{border:0;border-radius:18px;padding:20px;background:#ffbe4d;color:#21102e;font-weight:900;font-size:16px;cursor:pointer}.card{margin:30px auto;max-width:600px;min-height:160px;border-radius:30px;background:linear-gradient(120deg,#823af1,#ec4a92);display:grid;place-items:center;padding:25px;font-size:25px;font-weight:bold;animation:flip .6s}.hidden{display:none}#reaction{font-size:45px}@keyframes flip{from{opacity:0;transform:rotateY(80deg)}to{opacity:1;transform:rotateY(0)}}</style><p style="color:#ffbe4d">STOP LYING OR GET FRIED</p><h1>🥃 NO CAP OR DRINK 2.0</h1><p>Animated flipcards · seven game modes · mobile preview</p><div id="modes" class="grid"></div><section id="game" class="hidden"><button onclick="back()">← Modes</button><h2 id="title"></h2><div id="card" class="card"></div><div id="reaction"></div><button onclick="next()">Next Flipcard →</button></section><h2>Meet the crew · 14 character slots</h2><p>Final lifelike 2D character art pending approval.</p><div class="grid" id="crew"></div><p>Static prototype: no online multiplayer or Supabase yet.</p><script>const modes={'Friends':['Who tells the funniest stories?','Who is always late?'],'Talking Stage':['What is your biggest green flag?','What is a dealbreaker?'],'Couples':['Who apologizes first?','What makes you feel appreciated?'],'Confessional':['Who wrote this anonymous confession?','What is something nobody knows about you?'],'Confessionals Pt. 2':['What confession surprised you most?'],'Most Likely To':['Who is most likely to go viral?','Who is most likely to miss a flight?'],'Dare or Drink':['Do your best dance or pass.','Show your funniest selfie or pass.']};let mode='',i=0;for(const k of Object.keys(modes)){let b=document.createElement('button');b.textContent=k;b.onclick=()=>{mode=k;i=0;document.getElementById('title').textContent=k;document.getElementById('modes').classList.add('hidden');document.getElementById('game').classList.remove('hidden');next()};document.getElementById('modes').append(b)}for(let j=1;j<=14;j++){let d=document.createElement('div');d.textContent='👤 Player '+j;document.getElementById('crew').append(d)}function next(){const c=document.getElementById('card');c.style.animation='none';void c.offsetWidth;c.style.animation='flip .6s';c.textContent=modes[mode][i++%modes[mode].length];document.getElementById('reaction').textContent=['😂','🔥','👀','😱'][Math.floor(Math.random()*4)]}function back(){document.getElementById('modes').classList.remove('hidden');document.getElementById('game').classList.add('hidden')}</script></html>
